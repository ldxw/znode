services:
  # ------------------------------
  # 后端服务
  # ------------------------------
  backend:
    image: ghcr.io/ldxw/znode-backend:latest
    container_name: znode-backend
    restart: unless-stopped
    # 后端自己的配置（DATABASE_URL、各 OAuth key 等）放这里
    env_file:
      - ./.env
    environment:
      PORT: "3002"
      # 允许跨域的前端域名，多个用英文逗号分隔；前后端同域部署时可以不设
      FRONTEND_URL: ${FRONTEND_URL:-}
    # 只给 compose 内部网络用，不对外发布端口（需要从宿主机直连调试时再打开）
    # ports:
    #   - "3002:3002"
    expose:
      - "3002"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      znode_net:
        ipv4_address: 172.30.2.20
    # 日志轮转，避免 json 日志把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------
  # 前端服务
  # ------------------------------
  frontend:
    image: ghcr.io/ldxw/znode-frontend:latest
    container_name: znode-frontend
    restart: unless-stopped
    environment:
      # 浏览器访问后端的地址；留空 = 同域反代（nginx 把 /api 转给 backend:3002）
      API_URL: ${API_URL:-}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      znode_net:
        ipv4_address: 172.30.2.10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------
  # MariaDB 数据库（备用，暂未启用）
  # mariadb:
  #   image: mariadb:11
  #   container_name: znode-mariadb
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 docker/.env 里设置 MYSQL_ROOT_PASSWORD}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-znode}
  #     MYSQL_USER: ${MYSQL_USER:-znode}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 docker/.env 里设置 MYSQL_PASSWORD}
  #   healthcheck:
  #     test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 5s
  #   volumes:
  #     - mariadb_data:/var/lib/mysql
  #   networks:
  #     znode_net:
  #       ipv4_address: 172.30.2.30

  # ------------------------------
  # MySQL 8.0
  # ------------------------------
  mysql:
    image: mysql:8.0.36
    container_name: znode-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 docker/.env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-znode}
      MYSQL_USER: ${MYSQL_USER:-znode}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 docker/.env 里设置 MYSQL_PASSWORD}
    # 数据库不需要对外发布端口（要直连调试时再打开，并只绑本机）
    # ports:
    #   - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      znode_net:
        ipv4_address: 172.30.2.40
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ------------------------------
# 网络和卷
# ------------------------------
networks:
  znode_net:
    name: znode_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24
          gateway: 172.30.2.1

volumes:
  # mariadb_data:
  #   driver: local
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/mysql
