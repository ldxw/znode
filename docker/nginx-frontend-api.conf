# 前后端同域：静态文件 + /api 反代给后端
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # 安全响应头（管理面板默认收紧：禁 iframe 嵌入、禁 MIME 嗅探等）
    include /etc/nginx/snippets/security-headers.conf;

    # 上传 / 导入 / 备份包可能很大，nginx 默认只放 1m，会直接 413
    client_max_body_size 100m;

    # 文本类资源压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 带 hash 的静态资源可以长期缓存（vite 产物默认带 hash）；
    # 注意：运行时改 API_URL 不会改变 hash，回访用户可能要等缓存过期或强刷
    location /assets/ {
        # 这里自己写了 add_header，父级的安全头不会继承，要再 include 一次
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立刻拿到新的资源引用
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # 前端路由回退（SPA）
    location / {
        try_files $uri /index.html;
    }

    # 所有 /api/ 请求代理到后端。
    # CORS 交给后端的 cors 中间件统一处理 —— 这里不要再加 Access-Control-Allow-*：
    # 重复的 CORS 响应头会让浏览器直接报错，而且 * 配 credentials 本身也不合法。
    location /api/ {
        proxy_pass http://backend:3002;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 导入 / 备份接口可能跑很久
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }
}
